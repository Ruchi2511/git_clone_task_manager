{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-panel">
    <div class="auth-logo">
      <div class="auth-logo-icon">⬡</div>
      <span class="auth-logo-name">ProjectHub</span>
    </div>

    <form method="POST" class="auth-card">
      <h1>Create Super User</h1>
      <p>First-time portal setup only. All subsequent users are created from the Super User portal.</p>

      <label for="name">Full name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>

      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a strong password" required>

      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>

      <button type="submit">Create Super User</button>

      <span class="auth-footer">
        Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
      </span>
    </form>
  </div>
</div>
{% endblock %}
