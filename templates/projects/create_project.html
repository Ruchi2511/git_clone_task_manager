{% extends "base.html" %}
{% block breadcrumb %}<div class="breadcrumb"><span class="current">Create Project</span></div>{% endblock %}
{% block content %}
<div class="form-page">
  <form method="POST" class="form-card">
    <h1>Create Project</h1>
    <p>Set up a new project for your organization.</p>
    <input type="hidden" name="org_id" value="{{ org_id }}">
    <div class="form-group"><label>Project Name</label><input type="text" name="name" placeholder="Project name" required></div>
    <div class="form-group"><label>Description</label><textarea name="description" placeholder="What is this project about?"></textarea></div>
    <div class="form-group"><label>Deadline</label><input type="date" name="deadline"></div>
    <button type="submit" class="btn primary">Create Project</button>
  </form>
</div>
{% endblock %}
