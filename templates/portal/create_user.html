{% extends "base.html" %}
{% block breadcrumb %}
<div class="breadcrumb">
  <a href="{{ url_for('portal.users') }}">Portal Users</a>
  <span class="sep">/</span>
  <span class="current">Create User</span>
</div>
{% endblock %}
{% block content %}
<div class="form-page">
  <form method="POST" class="form-card">
    <h1>Create Portal User</h1>
    <p>Add a new user to the portal.</p>
    <div class="form-group"><label>Full Name</label><input type="text" name="name" placeholder="User's full name" required></div>
    <div class="form-group"><label>Email Address</label><input type="email" name="email" placeholder="user@example.com" required></div>
    <div class="form-group"><label>Password</label><input type="password" name="password" placeholder="Create a password" required></div>
    <div class="form-group"><label>Portal Role</label>
      <select name="portal_role">
        {% for role in roles %}<option value="{{ role }}">{{ role }}</option>{% endfor %}
      </select>
    </div>
    <button type="submit" class="btn primary">Create User</button>
  </form>
</div>
{% endblock %}
