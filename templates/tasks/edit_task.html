{% extends "base.html" %}
{% block breadcrumb %}
<div class="breadcrumb">
  <a href="{{ url_for('tasks.task_detail', task_id=task._id) }}">Job</a>
  <span class="sep">/</span>
  <span class="current">Edit</span>
</div>
{% endblock %}
{% block content %}
<div class="form-page">
  <form method="POST" class="form-card">
    <h1>Edit Job</h1>
    <p>Update job details below.</p>
    <div class="form-group"><label>Job Title</label><input type="text" name="title" value="{{ task.title }}" required></div>
    <div class="form-group"><label>Description</label><textarea name="description">{{ task.description or "" }}</textarea></div>
    <div class="form-group"><label>Status</label>
      <select name="status">
        {% for s in ["To Do","In Progress","Review","Done"] %}<option value="{{ s }}" {% if task.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Priority</label>
      <select name="priority">
        {% for p in ["Low","Medium","High","Critical"] %}<option value="{{ p }}" {% if task.priority==p %}selected{% endif %}>{{ p }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Assigned To</label>
      <select name="assigned_to">
        <option value="">Unassigned</option>
        {% for member in members %}<option value="{{ member._id }}" {% if task.assigned_to==member._id %}selected{% endif %}>{{ member.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Due Date</label><input type="date" name="due_date" value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}"></div>
    <button type="submit" class="btn primary">Save Changes</button>
  </form>
</div>
{% endblock %}
